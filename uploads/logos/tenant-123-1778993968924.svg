<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ggBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="ggDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="ggGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Squircle Backdrop -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#ggDarkGrad)" stroke="#334155" stroke-width="2" />

  <!-- Gear Cog Outer Shape -->
  <g transform="translate(50, 50)" filter="url(#ggGlow)">
    <!-- 8 Cog Teeth -->
    <path d="
      M -10 -40 L 10 -40 L 8 -30 L -8 -30 Z
      M 30 -10 L 40 -10 L 40 10 L 30 8 L 30 -8 Z
      M 10 40 L -10 40 L -8 30 L 8 30 Z
      M -30 10 L -40 10 L -40 -10 L -30 -8 L -30 8 Z
      M 21 -28 L 35 -21 L 28 -7 L 16 -16 Z
      M 28 21 L 21 35 L 7 28 L 16 16 Z
      M -21 35 L -35 21 L -28 7 L -16 16 Z
      M -35 -21 L -21 -35 L -7 -28 L -16 -16 Z
    " fill="url(#ggBrandGrad)" />

    <!-- Outer Gear Body Ring -->
    <circle cx="0" cy="0" r="32" fill="url(#ggBrandGrad)" />
    
    <!-- Cutout Ring -->
    <circle cx="0" cy="0" r="22" fill="#0F172A" />

    <!-- Center Hub Core -->
    <circle cx="0" cy="0" r="13" fill="url(#ggBrandGrad)" />
    
    <!-- Central Grid Axle Hole -->
    <circle cx="0" cy="0" r="6" fill="#0F172A" />

    <!-- 4 Axle Cross Spokes -->
    <rect x="-2" y="-22" width="4" height="44" fill="#F59E0B" opacity="0.85" />
    <rect x="-22" y="-2" width="44" height="4" fill="#F59E0B" opacity="0.85" />
  </g>
</svg>
