name: Backend Test PR Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'vitest.config.js'

jobs:
  test:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: "test-jwt-secret-super-long-geargrid-key-32chars"
      JWT_REFRESH_SECRET: "test-jwt-refresh-secret-geargrid-key-32chars"
      NODE_ENV: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Vitest Suite
        run: npm test -- --reporter=verbose
